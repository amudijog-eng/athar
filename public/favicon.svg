<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F382C" />
      <stop offset="100%" stop-color="#062C22" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="24" fill="url(#emeraldGrad)" />
  <circle cx="50" cy="50" r="42" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6" stroke-dasharray="4 2"/>
  <!-- Islamic Crescent & Eight-Pointed Star -->
  <path d="M50 18 A32 32 0 1 0 74 68 A26 26 0 1 1 50 18 Z" fill="url(#goldGrad)" opacity="0.9" />
  <!-- Star -->
  <polygon points="62,28 64,34 70,34 65,38 67,44 62,40 57,44 59,38 54,34 60,34" fill="url(#goldGrad)"/>
  <!-- Calligraphic Letter "أثر" -->
  <text x="50" y="62" font-family="'Amiri', 'Traditional Arabic', serif" font-size="28" font-weight="bold" fill="#FDFBF7" text-anchor="middle">أثر</text>
</svg>